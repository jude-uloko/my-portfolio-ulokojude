name: Update Language Stats

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install tokei
        run: npm install -g tokei

      - name: Generate language stats
        run: node scripts/update-languages.js

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Language Stats Bot"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: update language statistics" && git push)
